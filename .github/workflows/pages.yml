# Builds BioSketch and puts it on GitHub Pages, so that it can be used at an address without
# installing anything. It runs when `main` changes (bring `develop` into `main` to publish a new
# version) and can be started by hand under Actions. The checks that every change must pass run
# first: a version that fails them is not published.
#
# Once, in the repository on GitHub: Settings › Pages › Build and deployment › Source: GitHub Actions.

name: Publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a newer one takes the place of one that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
